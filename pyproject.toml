[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ako-rageval"
dynamic = ["version"]
description = "Evaluation harness for Persian (Farsi) RAG pipelines: text normalization, chunking and retriever comparison, retrieval and answer metrics, HTML reports."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Akomind" }]
keywords = ["rag", "evaluation", "persian", "farsi", "retrieval", "bm25", "nlp", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: Persian",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ako-rageval = "ako_rageval.cli:main"

[project.urls]
Homepage = "https://github.com/smzmotamed/ako-rageval"
Issues = "https://github.com/smzmotamed/ako-rageval/issues"
Source = "https://github.com/smzmotamed/ako-rageval"

[tool.hatch.version]
path = "src/ako_rageval/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ako_rageval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
